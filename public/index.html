<!DOCTYPE html>
<html>
<head>
    <title>Pulse Stresser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background: #0b0b12;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .glass {
            background: rgba(20, 22, 36, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }
        h1 {
            color: #f0f0ff;
            font-weight: 300;
            font-size: 24px;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #555;
            font-size: 13px;
            text-align: center;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            color: #8888aa;
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.35);
            color: #f0f0ff;
            font-size: 16px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #8B5CF6;
        }
        .ports-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 16px;
            text-align: center;
            color: #8888aa;
            font-size: 13px;
        }
        .ports-display span {
            color: #5ce0e0;
            font-weight: 600;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #8B5CF6;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn:hover {
            background: #7c3aed;
            transform: scale(1.02);
        }
        .btn:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            color: #8888aa;
            font-size: 14px;
            text-align: center;
            margin-top: 16px;
        }
        .status.success {
            color: #22c55e;
        }
        .status.error {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="glass">
        <h1>🌐 Pulse Stresser</h1>
        <p class="subtitle">Multi-port attack — hits all common ports</p>
        <div class="input-group">
            <label>Target IP</label>
            <input type="text" id="ipInput" placeholder="192.168.1.1" />
        </div>
        <div class="input-group">
            <label>Duration (seconds)</label>
            <input type="number" id="durationInput" placeholder="60" value="60" />
        </div>
        <div class="ports-display">
            🎯 Targeting ports: <span>80, 443, 53, 8080, 8443</span>
        </div>
        <button class="btn" id="attackBtn" onclick="launchAttack()">🚀 Launch Attack</button>
        <div class="status" id="status">Ready</div>
    </div>

    <script>
        async function launchAttack() {
            const ip = document.getElementById('ipInput').value.trim();
            const duration = document.getElementById('durationInput').value || 60;
            const btn = document.getElementById('attackBtn');
            const status = document.getElementById('status');

            if (!ip) {
                status.textContent = '❌ Please enter a target IP.';
                status.className = 'status error';
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Launching...';
            status.textContent = '⏳ Sending attack command...';
            status.className = 'status';

            try {
                const res = await fetch('/api/attack', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip, duration: parseInt(duration) })
                });
                const data = await res.json();

                if (data.success) {
                    status.textContent = `✅ Attack launched on ${ip} (all ports) for ${duration}s`;
                    status.className = 'status success';
                } else {
                    status.textContent = `❌ ${data.message}`;
                    status.className = 'status error';
                }
            } catch (err) {
                status.textContent = '❌ Failed to connect to server.';
                status.className = 'status error';
            }

            btn.disabled = false;
            btn.textContent = '🚀 Launch Attack';
        }
    </script>
</body>
</html>
